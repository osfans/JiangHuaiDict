<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>淮语词典</title>
  <style>
    :root {
      --bg: #eef4ff;
      --card: #fafdff;
      --ink: #162033;
      --muted: #4b6289;
      --line: #cfe0ff;
      --brand: #1d4ed8;
      --chip: #e8f0ff;
      --chip-line: #c1d6ff;
      --chip-text: #1e40af;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 0%, #dbeafe 0%, transparent 36%),
        radial-gradient(circle at 95% 20%, #bfdbfe 0%, transparent 30%),
        var(--bg);
    }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 36px; }
    h1 { margin: 0 0 8px; font-size: 34px; line-height: 1.2; }
    .sub { color: var(--muted); margin-bottom: 16px; }
    .ref-panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 12px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.05);
    }
    .ref-title {
      color: #1e3a8a;
      font-weight: 700;
      margin-bottom: 8px;
      cursor: pointer;
      user-select: none;
      list-style: none;
    }
    .ref-title::-webkit-details-marker {
      display: none;
    }
    .ref-title::before {
      content: '▸';
      display: inline-block;
      margin-right: 6px;
      transition: transform 0.15s ease;
    }
    .ref-panel[open] .ref-title::before {
      transform: rotate(90deg);
    }
    .ref-list {
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
    }
    .ref-book { color: #30476f; }
    .ref-author { color: var(--muted); margin-left: 4px; }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.05);
    }
    .controls { display: grid; grid-template-columns: auto 1fr 220px; gap: 10px; align-items: center; }
    input, select {
      height: 42px;
      border-radius: 10px;
      border: 1px solid #b8cdf8;
      background: #fff;
      color: var(--ink);
      font-size: 15px;
      padding: 0 12px;
    }
    .check {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
      user-select: none;
    }
    .check input {
      width: 16px;
      height: 16px;
      margin: 0;
      padding: 0;
    }
    .stats { margin: 12px 2px 8px; color: var(--muted); font-size: 14px; }
    .list { display: grid; gap: 10px; }
    .item {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      background: #fff;
    }
    .heads { font-size: 18px; color: #1e3a8a; margin-bottom: 6px; display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
    .heads-pinyin { font-size: 14px; color: var(--muted); }
    .exp { font-size: 14px; color: var(--ink); margin-bottom: 0; line-height: 1.75; white-space: pre-wrap; }
    .chip {
      display: inline-block;
      font-size: 12px;
      background: var(--chip);
      border: 1px solid var(--chip-line);
      color: var(--chip-text);
      border-radius: 4px;
      padding: 1px 4px;
      margin-right: 2px;
    }
    .chip.chip-dynamic {
      background: var(--chip-bg, var(--chip));
      border-color: var(--chip-line-dyn, var(--chip-line));
      color: var(--chip-text-dyn, var(--chip-text));
    }
    .hl {
      background: #ffe8a3;
      color: #5f3d00;
      padding: 0 1px;
      border-radius: 4px;
    }
    .head-mark-single {
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }
    .head-mark-double {
      text-decoration: underline;
      text-decoration-style: double;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }
    .head-mark-wave {
      text-decoration: underline;
      text-decoration-style: wavy;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }
    .head-mark-emphasis {
      text-emphasis: triangle;
      text-emphasis-position: under;
      -webkit-text-emphasis: triangle;
      -webkit-text-emphasis-position: under;
    }
    .head-ruby rt {
      font-size: 11px;
      line-height: 1;
      color: var(--muted);
    }
    .head-note {
      font-size: 12px;
      color: var(--muted);
      margin-left: 2px;
    }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 28px 0;
    }
    @media (max-width: 760px) {
      .controls { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>淮语词典</h1>
    <div class="sub">共<span id="allCount">__TOTAL__</span>个词，<span id="updatedAt">__UPDATED_AT__</span>更新</div>

    <details class="ref-panel">
      <summary class="ref-title">参考书目</summary>
      <ul class="ref-list">
        __REFS_HTML__
      </ul>
    </details>

    <div class="panel">
      <div class="controls">
        <label class="check" for="headOnly"><input id="headOnly" type="checkbox" checked />仅词头</label>
        <input id="q" placeholder="正在加载，请稍候" disabled />
        <select id="dialect"></select>

      </div>
      <div class="stats" id="stats"></div>
      <div class="list" id="list"></div>
    </div>
  </div>

  <script>
    const CHUNK_SIZE = 200;
    const DEBOUNCE_MS = 120;

    const DIALECTS = __DIALECTS_JSON__;
    const RAW = __DATA_JSON__;
    function normalizeHeadForSearch(s) {
      return stripHeadMarkers(String(s || '').replace(/(.)[(][^()]*[)]/g, '$1'));
    }

    function stripHeadMarkers(s) {
      return String(s || '').replace(/[-=?+]/g, '');
    }

    const DATA = RAW.map(r => ({
      dialect: DIALECTS[r[0]],
      heads: r[1] || [],
      pinyin: r[2] || [],
      explanation: r[3] || ''
    }));
    const INDEXED = DATA.map(item => ({
      ...item,
      headText: item.heads.map(normalizeHeadForSearch).join(' ').toLowerCase(),
      fullText: [
        item.heads.map(normalizeHeadForSearch).join(' '),
        (item.pinyin || []).join(' '),
        item.explanation || ''
      ].join(' ').toLowerCase()
    }));

    const qEl = document.getElementById('q');
    const dialectEl = document.getElementById('dialect');
    const headOnlyEl = document.getElementById('headOnly');
    const listEl = document.getElementById('list');
    const statsEl = document.getElementById('stats');
    let currentMatches = [];
    let renderedCount = 0;
    let io = null;
    let currentQuery = '';

    const dialects = DIALECTS.slice();
    const displayDialects = [...new Set(dialects.map(displayDialect))];
    dialectEl.innerHTML = ['<option value="">全部方言</option>']
      .concat(displayDialects.map(d => `<option value="${d}">${d}</option>`)).join('');

    function displayDialect(d) {
      return String(d || '').replace(/\d+$/, '');
    }

    function stableHash(text) {
      const src = String(text || '');
      let h = 2166136261;
      for (let i = 0; i < src.length; i += 1) {
        h ^= src.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    }

    function chipStyleVars(label) {
      const seed = stableHash(String(label || ''));
      const hue = seed % 360;
      const satBg = 68 + (seed % 10);
      const satLine = 42 + ((seed >> 3) % 16);
      const satText = 56 + ((seed >> 5) % 18);
      const lightBg = 93 - ((seed >> 7) % 5);
      const lightLine = 76 - ((seed >> 11) % 8);
      const lightText = 26 + ((seed >> 13) % 8);
      return [
        `--chip-bg:hsl(${hue} ${satBg}% ${lightBg}%);`,
        `--chip-line-dyn:hsl(${hue} ${satLine}% ${lightLine}%);`,
        `--chip-text-dyn:hsl(${hue} ${satText}% ${lightText}%);`
      ].join('');
    }

    function renderDynamicChip(label) {
      const safeLabel = escapeChip(String(label || ''));
      return `<span class="chip chip-dynamic" style="${chipStyleVars(label)}">${safeLabel}</span>`;
    }

    function norm(s) {
      return (s || '').toLowerCase().trim();
    }

    function isPinyinQuery(q) {
      // 只包含字母、数字、空格
      return /^[a-zA-Z0-9 ]+$/.test(q.trim());
    }

    function matchPinyin(entry, q) {
      // q 已经 trim
      if (!q) return true;
      const segs = q.split(/\s+/).filter(Boolean);
      if (!segs.length) return true;
      // entry.pinyin 可能为空
      if (!entry.pinyin || !entry.pinyin.length) return false;
      // 支持 ['zz1 zo5'] 这种情况，先按空格拆分所有拼音片段
      const pinyinSegs = entry.pinyin.flatMap(p => p.split(/\s+/).filter(Boolean));
      if (segs.length > pinyinSegs.length) return false;
      for (let i = 0; i < segs.length; i++) {
        if (!pinyinSegs[i] || !pinyinSegs[i].toLowerCase().startsWith(segs[i].toLowerCase())) {
          return false;
        }
      }
      return true;
    }

    function match(entry, q, dialect, headOnly) {
      if (dialect && displayDialect(entry.dialect) !== dialect) return false;
      if (!q) return true;
      if (isPinyinQuery(q)) {
        return matchPinyin(entry, q.trim());
      }
      const pool = headOnly ? entry.headText : entry.fullText;
      const segs = q.split(/\s+/).filter(Boolean);
      return segs.every(seg => pool.includes(seg));
    }

    function escapeRegExp(s) {
      return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function highlightText(text, rawQuery) {
      const src = String(text || '');
      const keyword = (rawQuery || '').trim();
      if (!keyword) return escapeHtml(src);

      // 多分段高亮，如 zz zo
      const segs = keyword.split(/\s+/).filter(Boolean);
      if (segs.length <= 1) {
        const pattern = new RegExp(escapeRegExp(keyword), 'ig');
        let result = '';
        let last = 0;
        let matched = false;
        let m;
        while ((m = pattern.exec(src)) !== null) {
          matched = true;
          const start = m.index;
          const end = start + m[0].length;
          result += escapeHtml(src.slice(last, start));
          result += `<mark class="hl">${escapeHtml(src.slice(start, end))}</mark>`;
          last = end;
        }
        if (!matched) return escapeHtml(src);
        result += escapeHtml(src.slice(last));
        return result;
      }
      // 多分段高亮
      let result = '';
      let last = 0;
      let matched = false;
      // 构造所有分段的正则，按长度从长到短排序
      const sortedSegs = segs.sort((a, b) => b.length - a.length);
      const pattern = new RegExp(sortedSegs.map(escapeRegExp).join('|'), 'ig');
      let m;
      while ((m = pattern.exec(src)) !== null) {
        matched = true;
        const start = m.index;
        const end = start + m[0].length;
        result += escapeHtml(src.slice(last, start));
        result += `<mark class="hl">${escapeHtml(src.slice(start, end))}</mark>`;
        last = end;
      }

      if (!matched) return escapeHtml(src);
      result += escapeHtml(src.slice(last));
      return result;
    }

    function markerToClass(marker) {
      if (marker === '-') return 'head-mark-single';
      if (marker === '=') return 'head-mark-double';
      if (marker === '?') return 'head-mark-wave';
      if (marker === '+') return 'head-mark-emphasis';
      return '';
    }

    function splitHeadAnnotation(content) {
      const text = String(content || '').trim();
      const match = text.match(/^([A-Za-z0-9]+)(.*)$/);
      if (!match) {
        return { ruby: '', note: text };
      }
      return {
        ruby: match[1],
        note: (match[2] || '').trim()
      };
    }

    function tokenizeHeadWord(word) {
      const tokens = [];
      const leadingAnnotations = [];
      const text = String(word || '');

      for (let i = 0; i < text.length; i += 1) {
        const ch = text[i];
        if ((ch === '-' || ch === '=' || ch === '?' || ch === '+') && tokens.length) {
          tokens[tokens.length - 1].mark = ch;
          continue;
        }
        if (ch === '(') {
          let end = i + 1;
          while (end < text.length && text[end] !== ')') end += 1;
          const content = text.slice(i + 1, end < text.length ? end : text.length).trim();
          if (content) {
            const annotation = splitHeadAnnotation(content);
            if (tokens.length) {
              tokens[tokens.length - 1].annotations.push(annotation);
            } else {
              leadingAnnotations.push(annotation);
            }
          }
          i = end < text.length ? end : text.length;
          continue;
        }
        tokens.push({ ch, mark: '', annotations: [] });
      }

      return { tokens, leadingAnnotations };
    }

    function renderStandaloneAnnotation(annotation) {
      const text = [annotation.ruby, annotation.note].filter(Boolean).join(' ');
      if (!text) return '';
      return `<small class="head-note">${escapeHtml(text)}</small>`;
    }

    function renderHeadToken(token) {
      const cls = markerToClass(token.mark);
      let base = escapeHtml(token.ch);
      if (cls) {
        base = `<span class="${cls}">${base}</span>`;
      }

      let ruby = '';
      const notes = [];
      for (const annotation of token.annotations) {
        if (!ruby && annotation.ruby) {
          ruby = annotation.ruby;
        }
        if (annotation.note) {
          notes.push(annotation.note);
        }
      }

      const head = ruby
        ? `<ruby class="head-ruby">${base}<rt>${escapeHtml(ruby)}</rt></ruby>`
        : base;
      const noteHtml = notes.map(note => `<small class="head-note">${escapeHtml(note)}</small>`).join('');
      return `${head}${noteHtml}`;
    }

    function renderHeadWord(word, rawQuery) {
      const { tokens, leadingAnnotations } = tokenizeHeadWord(word);
      const src = tokens.map(t => t.ch).join('');
      const prefix = leadingAnnotations.map(renderStandaloneAnnotation).join('');
      const keyword = (rawQuery || '').trim();
      if (!keyword) {
        return prefix + tokens.map(renderHeadToken).join('');
      }

      const segs = keyword.split(/\s+/).filter(Boolean);
      const pattern = segs.length <= 1
        ? new RegExp(escapeRegExp(keyword), 'ig')
        : new RegExp(segs.slice().sort((a, b) => b.length - a.length).map(escapeRegExp).join('|'), 'ig');

      const ranges = [];
      let m;
      while ((m = pattern.exec(src)) !== null) {
        ranges.push([m.index, m.index + m[0].length]);
      }

      if (!ranges.length) {
        return prefix + tokens.map(renderHeadToken).join('');
      }

      let out = prefix;
      let r = 0;
      for (let i = 0; i < tokens.length; i += 1) {
        while (r < ranges.length && i >= ranges[r][1]) r += 1;
        if (r < ranges.length && i === ranges[r][0]) out += '<mark class="hl">';

        out += renderHeadToken(tokens[i]);

        if (r < ranges.length && i + 1 === ranges[r][1]) out += '</mark>';
      }
      return out;
    }

    function renderHeads(heads, rawQuery) {
      return (heads || []).map(h => renderHeadWord(h, rawQuery)).join(' / ');
    }

    function renderChunk(items, append = false) {
      if (!append) {
        listEl.innerHTML = '';
      }
      const fragments = items.map(item => {
        const heads = `<span>${renderHeads(item.heads, currentQuery)}</span>`;
        const dialect = renderDynamicChip(item.dialect);
        const pinyin = (item.pinyin && item.pinyin.length)
          ? `<span class="heads-pinyin">${highlightText(item.pinyin.join('; '), currentQuery)}</span>`
          : '';
        const exp = !!(item.explanation && item.explanation.trim())
          ? `<div class="exp">${renderExplanation(item.explanation, currentQuery)}</div>`
          : '';
        return `
          <article class="item">
            <div class="heads">${heads}${pinyin}${dialect}</div>
            ${exp}
          </article>
        `;
      });
      if (append) {
        listEl.insertAdjacentHTML('beforeend', fragments.join(''));
      } else {
        listEl.innerHTML = fragments.join('');
      }
    }

    function renderExplanation(explanation, rawQuery) {
      const src = String(explanation || '');
      if (!src) return '';
      const regex = /〔([^〕]+)〕/g;
      let last = 0;
      let out = '';
      let m;
      while ((m = regex.exec(src)) !== null) {
        if (m.index > last) {
          out += highlightText(src.slice(last, m.index), rawQuery);
        }

        // 标签和普通文字之间补空格；连续标签之间不补。
        const prevChar = m.index > 0 ? src[m.index - 1] : '';
        if (prevChar && !/\s/.test(prevChar) && prevChar !== '〕') {
          out += ' ';
        }

        out += renderDynamicChip(m[1]);

        const nextIndex = m.index + m[0].length;
        const nextChar = nextIndex < src.length ? src[nextIndex] : '';
        if (nextChar && !/\s/.test(nextChar) && nextChar !== '〔') {
          out += ' ';
        }

        last = m.index + m[0].length;
      }
      if (last < src.length) {
        out += highlightText(src.slice(last), rawQuery);
      }
      return out;
    }

    function updateStats() {
      if (!currentMatches.length) {
        statsEl.textContent = '什么都没找到';
        return;
      }
      if (renderedCount < currentMatches.length) {
        statsEl.textContent = `找到 ${currentMatches.length} 条，已显示 ${renderedCount} 条`;
      } else {
        statsEl.textContent = `找到 ${currentMatches.length} 条`;
      }
    }

    function teardownObserver() {
      if (io) {
        io.disconnect();
        io = null;
      }
    }

    function setupObserver() {
      teardownObserver();
      if (renderedCount >= currentMatches.length) return;
      const sentinel = document.createElement('div');
      sentinel.id = 'lazySentinel';
      sentinel.className = 'empty';
      sentinel.textContent = '向下滚动以加载更多...';
      listEl.appendChild(sentinel);

      io = new IntersectionObserver((entries) => {
        if (!entries[0] || !entries[0].isIntersecting) return;
        renderNextChunk();
      }, { rootMargin: '200px 0px' });
      io.observe(sentinel);
    }

    function renderNextChunk(reset = false) {
      if (reset) {
        renderedCount = 0;
      }
      const sentinel = document.getElementById('lazySentinel');
      if (sentinel) sentinel.remove();

      if (!currentMatches.length) {
        teardownObserver();
        listEl.innerHTML = '<div class="empty">未找到匹配词条</div>';
        updateStats();
        return;
      }

      const next = currentMatches.slice(renderedCount, renderedCount + CHUNK_SIZE);
      if (!next.length) {
        teardownObserver();
        updateStats();
        return;
      }

      renderChunk(next, renderedCount > 0);
      renderedCount += next.length;
      updateStats();
      setupObserver();
    }

    function debounce(fn, delay) {
      let timer = null;
      return function (...args) {
        clearTimeout(timer);
        timer = setTimeout(() => fn.apply(this, args), delay);
      };
    }

    function search() {
      const qRaw = qEl.value;
      const q = norm(qRaw);
      const dialect = dialectEl.value;
      const headOnly = !!headOnlyEl.checked;
      currentQuery = qRaw;
      currentMatches = INDEXED.filter(x => match(x, q, dialect, headOnly));
      renderNextChunk(true);
    }

    function escapeHtml(s) {
      return s
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeChip(s) {
      return escapeHtml(s).replace(/(\d+)$/, '<small>$1</small>')
    }

    function finishLoading() {
      qEl.disabled = false;
      qEl.placeholder = '输入词头、拼音、释义开始搜索';
    }

    const searchDebounced = debounce(search, DEBOUNCE_MS);
    qEl.addEventListener('input', searchDebounced);
    dialectEl.addEventListener('change', search);
    headOnlyEl.addEventListener('change', search);

    // Initial render loads all entries
    statsEl.textContent = '正在加载...';
    listEl.innerHTML = '<div class="empty">正在加载词条...</div>';
    finishLoading();
    search();
  </script>
</body>
</html>
