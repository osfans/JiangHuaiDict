<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>淮语词典</title>
  <style>
    @font-face {
      font-family: 'P1';
      src: url('p1.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
    }
    @font-face {
      font-family: 'P2';
      src: url('p2.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
    }
    :root {
      --bg: #eef4ff;
      --card: #fafdff;
      --ink: #162033;
      --muted: #4b6289;
      --line: #cfe0ff;
      --brand: #1d4ed8;
      --chip: #e8f0ff;
      --chip-line: #c1d6ff;
      --chip-text: #1e40af;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", "P1", "P2", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 0%, #dbeafe 0%, transparent 36%),
        radial-gradient(circle at 95% 20%, #bfdbfe 0%, transparent 30%),
        var(--bg);
    }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 36px; }
    h1, h2, h3, h4, h5, h6 { margin: 8px; }
    .ref-panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 12px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.05);
    }
    .ref-title {
      color: #1e3a8a;
      margin-bottom: 8px;
      cursor: pointer;
      user-select: none;
      list-style: none;
    }
    .ref-title::-webkit-details-marker {
      display: none;
    }
    .ref-title::before {
      content: '▸';
      display: inline-block;
      margin-right: 6px;
      transition: transform 0.15s ease;
    }
    .ref-panel[open] .ref-title::before {
      transform: rotate(90deg);
    }
    .ref-list {
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
      line-height: 1.7;
      font-size: 12px;
    }
    .ref-book { color: #30476f; }
    .ref-author { color: var(--muted); margin-left: 4px; }
    .ref-count { color: var(--muted); margin-right: 6px; font-size: 12px; }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.05);
    }
    .controls { display: grid; grid-template-columns: minmax(0, 1fr) minmax(70px, 20vw); gap: 10px; align-items: center; }
    .search-wrap {
      position: relative;
      min-width: 0;
    }
    input, select {
      height: 42px;
      border-radius: 10px;
      border: 1px solid #b8cdf8;
      background: #fff;
      color: var(--ink);
      font-size: 15px;
      font-family: inherit;
      padding: 0 12px;
    }
    #q {
      width: 100%;
      padding-right: 78px;
    }
    .head-toggle {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      min-width: 62px;
      height: 32px;
      padding: 0 8px;
      border-radius: 8px;
      border: 1px solid #b8cdf8;
      background: #fff;
      color: var(--muted);
      font-size: 12px;
      line-height: 1;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .head-toggle.is-active {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
    }
    .head-toggle:focus-visible {
      outline: 2px solid #93c5fd;
      outline-offset: 1px;
    }
    .stats { margin: 12px 2px 8px; color: var(--muted); font-size: 12px; }
    .list { display: grid; gap: 10px; }
    .item {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      padding-bottom: 24px;
      background: #fff;
      position: relative;
    }
    .watermark {
      position: absolute;
      text-align: right;
      bottom: 8px;
      right: 8px;
      font-size: 10px;
      color: #b0c4de;
      opacity: 0.6;
      pointer-events: none;
      user-select: none;
    }
    .heads { font-size: 18px; color: #1e3a8a; margin-bottom: 6px; display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
    .heads.is-toggleable {
      cursor: pointer;
      user-select: text;
      -webkit-user-select: text;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .heads.is-toggleable::after {
      content: '';
      display: inline-block;
      margin-left: 6px;
      font-size: 12px;
      color: var(--muted);
      transform: translateY(-1px);
    }
    .heads.is-toggleable.is-collapsed::after {
      content: '▸';
    }
    .heads.is-toggleable:focus-visible {
      outline: 2px solid #93c5fd;
      outline-offset: 2px;
      border-radius: 4px;
    }
    .heads-pinyin { font-size: 12px; color: var(--muted); margin-left: 3px; }
    .head-pair { display: inline-flex; align-items: baseline; gap: 3px; }
    .exp { font-size: 15px; color: var(--ink); margin-bottom: 0; line-height: auto; white-space: pre-wrap; }
    .exp.is-collapsed { display: none; }
    .chip {
      display: inline-block;
      font-size: 12px;
      background: var(--chip);
      border: 1px solid var(--chip-line);
      color: var(--chip-text);
      border-radius: 4px;
      padding: 1px 4px;
      margin-left: 2px;
    }
    .chip.chip-dynamic {
      background: var(--chip-bg, var(--chip));
      border-color: var(--chip-line-dyn, var(--chip-line));
      color: var(--chip-text-dyn, var(--chip-text));
    }
    .hl {
      background: #ffe8a3;
      color: #5f3d00;
      padding: 0 1px;
      border-radius: 4px;
    }
    .head-mark-single {
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }
    .head-mark-double {
      text-decoration: underline;
      text-decoration-style: double;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }
    .head-mark-wave {
      text-decoration: underline;
      text-decoration-style: wavy;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }
    .head-mark-other {
      text-emphasis: "+";
      text-emphasis-position: under;
      -webkit-text-emphasis: "+";
      -webkit-text-emphasis-position: under;
    }
    .head-mark-special {
      text-emphasis: triangle;
      text-emphasis-position: under;
      -webkit-text-emphasis: triangle;
      -webkit-text-emphasis-position: under;
    }
    .head-ruby rt {
      color: var(--muted);
    }
    rt {
      margin-block: 1px;
    }
    .head-note {
      color: var(--muted);
      margin-left: 2px;
    }
    .head-coart-link {
      line-height: 1.2;
      vertical-align: bottom;
    }
    sub {
      vertical-align: bottom;
      font-size: 10px;
    }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 28px 0;
    }
    footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 12px;
      color: #4a6a8a;
      border-top: 1px solid #c0d8ee;
    }
    @media (max-width: 760px) {
      .controls { gap: 8px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>淮语词典</h2>
    <h5>__UPDATED_AT__更新</h5>

    <details class="ref-panel">
      <summary class="ref-title">参考资料<span id="refTotalCount"></span></summary>
      <ul class="ref-list" id="refList"></ul>
    </details>

    <div class="panel">
      <div class="controls">
        <div class="search-wrap">
          <input id="q" placeholder="正在加载，请稍候" disabled />
          <button id="headOnlyBtn" class="head-toggle" type="button">仅词头</button>
        </div>
        <select id="dialect"></select>

      </div>
      <div class="stats" id="stats"></div>
      <div class="list" id="list"></div>
    </div>
  </div>
  <footer><a href="https://github.com/osfans/JiangHuaiDict">淮语字典@GitHub</a></footer>

  <script>
    const CHUNK_SIZE = 200;
    const DEBOUNCE_MS = 120;

    const REFS = __REFS_JSON__;
    const DIALECTS = __DIALECTS_JSON__;
    const RAW = __DATA_JSON__;
    function normalizeHeadForSearch(s) {
      return stripHeadMarkers(String(s || '').replace(/(.)[(][^()]*[)]/g, '$1'));
    }

    function stripHeadMarkers(s) {
      return String(s || '').replace(/[-=?+!&]/g, '');
    }

    const DATA = RAW.map(r => {
      const dialect = DIALECTS[r[0]];
      const meta = REFS[dialect] || {};
      const heads = r[1];
      const heads2 = [];
      heads.forEach(element => {
        if (element.includes("[")) {
          heads2.push(element.replace(/\[(.*?)\]/g, ""));
          heads2.push(element.replace(/\[(.*?)\]/g, "$1"));
        } else {
          heads2.push(element);
        }
      });
      const pinyins = r[2];
      const pinyins2 = [];
      pinyins.forEach(element => {
        if (element.includes("[")) {
          pinyins2.push(element.replace(/\[(.*?)\]/g, " "));
          pinyins2.push(element.replace(/\[(.*?)\]/g, " $1 "));
        } else {
          pinyins2.push(element);
        }
      });
      return {
        dialect: dialect,
        heads: heads2,
        pinyin: pinyins2,
        explanation: r[3] || '',
        book: meta.book || ''
      };
    });
    const INDEXED = DATA.map(item => ({
      ...item,
      headText: item.heads.map(normalizeHeadForSearch).join(' ').toLowerCase(),
      fullText: [
        item.heads.map(normalizeHeadForSearch).join(' '),
        (item.pinyin || []).join(' '),
        item.explanation || ''
      ].join(' ').toLowerCase()
    }));

    const qEl = document.getElementById('q');
    const dialectEl = document.getElementById('dialect');
    const headOnlyBtnEl = document.getElementById('headOnlyBtn');
    const listEl = document.getElementById('list');
    const statsEl = document.getElementById('stats');
        function isHeadOnlyEnabled() {
          return headOnlyBtnEl.getAttribute('aria-pressed') === 'true';
        }

        function setHeadOnlyEnabled(enabled) {
          headOnlyBtnEl.setAttribute('aria-pressed', enabled ? 'true' : 'false');
          headOnlyBtnEl.classList.toggle('is-active', enabled);
        }

    let currentMatches = [];
    let renderedCount = 0;
    let io = null;
    let currentQuery = '';

    const dialects = DIALECTS.slice();
    const displayDialects = [...new Set(dialects.map(displayDialect))];
    dialectEl.innerHTML = ['<option value="">不限</option>']
      .concat(displayDialects.map(d => `<option value="${d}">${d}</option>`)).join('');

    function displayDialect(d) {
      return String(d || '').replace(/\d+$/, '');
    }

    function stableHash(text) {
      const src = String(text || '');
      let h = 2166136261;
      for (const char of src) {
        h ^= (char.codePointAt(0) || 0);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    }

    function chipStyleVars(label) {
      const seed = stableHash(displayDialect(String(label || '')));
      const hue = seed % 360;
      const satBg = 68 + (seed % 10);
      const satLine = 42 + ((seed >> 3) % 16);
      const satText = 56 + ((seed >> 5) % 18);
      const lightBg = 93 - ((seed >> 7) % 5);
      const lightLine = 76 - ((seed >> 11) % 8);
      const lightText = 26 + ((seed >> 13) % 8);
      return [
        `--chip-bg:hsl(${hue} ${satBg}% ${lightBg}%);`,
        `--chip-line-dyn:hsl(${hue} ${satLine}% ${lightLine}%);`,
        `--chip-text-dyn:hsl(${hue} ${satText}% ${lightText}%);`
      ].join('');
    }

    function renderDynamicChip(label) {
      const safeLabel = escapeChip(String(label || ''));
      return `<span class="chip chip-dynamic" style="${chipStyleVars(label)}">${safeLabel}</span>`;
    }

    function normQuery(s) {
      s = (s || '').toLowerCase().trim();
      if (isPinyinQuery(s)) {
        s = s.replaceAll("ou", "eu").replaceAll("ai", "ae").replaceAll("ao", "o").replaceAll("ui", "uei").replaceAll("ing", "ien").replace(/([aoe]n)g/g, "$1").replace(/(iu)([^nh])/g, "ieu$2").replace(/(iu)$/g, "ieu");
      }
      return s;
    }

    function isPinyinQuery(q) {
      // 只包含字母、数字、空格
      return /^[a-zA-Z0-9 ]+$/.test(q.trim());
    }

    function matchPinyinSeq(pinyinSeg, q) {
      if (!pinyinSeg) return false;
      if (/\d$/.test(q)) {
        const q2 = q.replace(/^(.*)(\d)$/, "^$1\\d*?$2\\d*?$");
        return new RegExp(q2).test(pinyinSeg);
      }
      return pinyinSeg.toLowerCase().startsWith(q.toLowerCase());
    }

    function matchPinyin(entry, q) {
      // q 已经 trim
      if (!q) return true;
      const segs = q.split(/\s+/).filter(Boolean);
      if (!segs.length) return true;
      // entry.pinyin 可能为空
      if (!entry.pinyin || !entry.pinyin.length) return false;
      // 支持 ['zz1 zo5'] 这种情况，先按空格拆分所有拼音片段
      var ret = false;
      for (let j = 0; j < entry.pinyin.length; j++) {
        const pinyinSegs = formatPinyin(entry.pinyin[j]).split(/[\s\[\]]+/).filter(Boolean);
        if (segs.length > pinyinSegs.length) continue;
        var count = 0;
        for (let i = 0; i < segs.length; i++) {
          if (!matchPinyinSeq(pinyinSegs[i], segs[i])) {
            continue;
          }
          count++;
        }
        if (count == segs.length) return true;
      }
      return ret;
    }

    function match(entry, q, dialect, headOnly) {
      if (dialect) {
        const selfDialectMatched = displayDialect(entry.dialect) === dialect;
        const explanationDialectMatched = containsDialectTag(entry.explanation, dialect);
        if (!selfDialectMatched && !explanationDialectMatched) return false;
      }
      if (!q) return true;
      if (isPinyinQuery(q)) {
        return matchPinyin(entry, q.trim());
      }
      const pool = headOnly ? entry.headText : entry.fullText;
      const segs = q.split(/\s+/).filter(Boolean);
      return segs.every(seg => pool.replace(/[\[\]]/g,'').includes(seg));
    }

    function escapeRegExp(s) {
      return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function containsDialectTag(explanation, dialect) {
      const exp = String(explanation || '');
      const name = String(dialect || '').trim();
      if (!name) return false;
      const pattern = new RegExp(`〔\\s*${escapeRegExp(name)}\\s*〕`);
      return pattern.test(exp);
    }

    function highlightText(text, rawQuery) {
      const src = String(text || '');
      const keyword = (rawQuery || '').trim();
      if (!keyword) return escapeHtml(src);

      // 多分段高亮，如 zz zo
      const segs = keyword.split(/\s+/).filter(Boolean);
      if (segs.length <= 1) {
        const pattern = new RegExp(escapeRegExp(keyword), 'ig');
        let result = '';
        let last = 0;
        let matched = false;
        let m;
        while ((m = pattern.exec(src)) !== null) {
          matched = true;
          const start = m.index;
          const end = start + m[0].length;
          result += escapeHtml(src.slice(last, start));
          result += `<mark class="hl">${escapeHtml(src.slice(start, end))}</mark>`;
          last = end;
        }
        if (!matched) return escapeHtml(src);
        result += escapeHtml(src.slice(last));
        return result;
      }
      // 多分段高亮
      let result = '';
      let last = 0;
      let matched = false;
      // 构造所有分段的正则，按长度从长到短排序
      const sortedSegs = segs.sort((a, b) => b.length - a.length);
      const pattern = new RegExp(sortedSegs.map(escapeRegExp).join('|'), 'ig');
      let m;
      while ((m = pattern.exec(src)) !== null) {
        matched = true;
        const start = m.index;
        const end = start + m[0].length;
        result += escapeHtml(src.slice(last, start));
        result += `<mark class="hl">${escapeHtml(src.slice(start, end))}</mark>`;
        last = end;
      }

      if (!matched) return escapeHtml(src);
      result += escapeHtml(src.slice(last));
      return result;
    }

    function toFullWidth(text) {
      return String(text || '')
        .replace(/~/g, '～')
        .replace(/:/g, '：')
        .replace(/;/g, '；')
        .replace(/,/g, '，')
        .replace(/!/g, '！')
        .replace(/\?/g, '？');
    }

    function formatPinyin(text) {
      return String(text || '')
        .replace(/(\d)([a-z])/ig, '$1 $2')
        .replace(/\s+/g, ' ')
        .replaceAll("ui", "uei")
        .replace(/(i)(u[\d\s])/g, '$1e$2')
        .replace(/(i)(u)$/g, '$1e$2')
        .trim();
    }

    function markerToClass(marker) {
      if (marker === '-') return 'head-mark-single';
      if (marker === '=') return 'head-mark-double';
      if (marker === '?') return 'head-mark-wave';
      if (marker === '+') return 'head-mark-other';
      if (marker === '!') return 'head-mark-special';
      return '';
    }

    function splitHeadAnnotation(content) {
      const text = String(content || '').trim();
      const match = text.match(/^(.*?)([A-Za-z0-9\-]+)$/);
      if (!match) {
        return { ruby: '', note: text };
      }
      return {
        ruby: match[2],
        note: (match[1] || '').trim()
      };
    }

    function tokenizeHeadWord(word) {
      const tokens = [];
      const leadingAnnotations = [];
      const text = String(word || '');
      let inAnnotation = false;
      let annotationContent = '';

      function pushAnnotation(content) {
        const normalized = String(content || '').trim();
        if (!normalized) return;
        const annotation = splitHeadAnnotation(normalized);
        if (tokens.length) {
          tokens[tokens.length - 1].annotations.push(annotation);
        } else {
          leadingAnnotations.push(annotation);
        }
      }

      for (const ch of text) {
        if (inAnnotation) {
          if (ch === ')') {
            pushAnnotation(annotationContent);
            annotationContent = '';
            inAnnotation = false;
          } else {
            annotationContent += ch;
          }
          continue;
        }

        if ((ch === '-' || ch === '=' || ch === '?' || ch === '+' || ch === '!') && tokens.length) {
          tokens[tokens.length - 1].mark = ch;
          continue;
        }
        if (ch === '&' && tokens.length >= 2) {
          tokens[tokens.length - 2].coartWithNext = true;
          continue;
        }
        if (ch === '(') {
          inAnnotation = true;
          annotationContent = '';
          continue;
        }
        tokens.push({ ch, mark: '', annotations: [], coartWithNext: false });
      }

      if (inAnnotation) {
        pushAnnotation(annotationContent);
      }

      return { tokens, leadingAnnotations };
    }

    function renderStandaloneAnnotation(annotation) {
      const text = [annotation.ruby, annotation.note].filter(Boolean).join(' ');
      if (!text) return '';
      return `<sub class="head-note">${escapeHtml(text)}</sub>`;
    }

    function renderHeadToken(token) {
      const parts = getHeadTokenParts(token);
      const head = parts.ruby
        ? `<ruby class="head-ruby">${parts.base}<rt>${escapeHtml(parts.ruby)}</rt></ruby>`
        : parts.base;
      return `${head}${parts.noteHtml}`;
    }

    function getHeadTokenParts(token) {
      const cls = markerToClass(token.mark);
      let base = escapeHtml(token.ch);
      if (cls) {
        base = `<span class="${cls}">${base}</span>`;
      }

      let ruby = '';
      const notes = [];
      for (const annotation of token.annotations) {
        if (!ruby && annotation.ruby) {
          ruby = annotation.ruby;
        }
        if (annotation.note) {
          notes.push(annotation.note);
        }
      }

      return {
        base,
        ruby,
        noteHtml: notes.map(note => `<sub class="head-note">${escapeHtml(note)}</sub>`).join('')
      };
    }

    function renderCoartPair(leftToken, rightToken) {
      const left = getHeadTokenParts(leftToken);
      const right = getHeadTokenParts(rightToken);
      const pairRuby = right.ruby || left.ruby;
      const pairBase = `${left.base}<span class="head-coart-link">\u035C</span>${right.base}`;
      const pairHead = pairRuby
        ? `<ruby class="head-ruby">${pairBase}<rt>${escapeHtml(pairRuby)}</rt></ruby>`
        : pairBase;
      return `${pairHead}${left.noteHtml}${right.noteHtml}`;
    }

    function renderHeadTokens(tokens) {
      let out = '';
      for (let i = 0; i < tokens.length; i += 1) {
        if (tokens[i].coartWithNext && i + 1 < tokens.length) {
          out += renderCoartPair(tokens[i], tokens[i + 1]);
          i += 1;
          continue;
        }
        out += renderHeadToken(tokens[i]);
      }
      return out;
    }

    function renderHeadWord(word, rawQuery) {
      const { tokens, leadingAnnotations } = tokenizeHeadWord(word);
      const src = tokens.map(t => t.ch).join('');
      const prefix = leadingAnnotations.map(renderStandaloneAnnotation).join('');
      const keyword = (rawQuery || '').trim();
      if (!keyword) {
        return prefix + renderHeadTokens(tokens);
      }

      const segs = keyword.split(/\s+/).filter(Boolean);
      const pattern = segs.length <= 1
        ? new RegExp(escapeRegExp(keyword), 'ig')
        : new RegExp(segs.slice().sort((a, b) => b.length - a.length).map(escapeRegExp).join('|'), 'ig');

      const ranges = [];
      let m;
      while ((m = pattern.exec(src)) !== null) {
        ranges.push([m.index, m.index + [...m[0]].length]);
      }

      if (!ranges.length) {
        return prefix + renderHeadTokens(tokens);
      }

      let out = prefix;
      let r = 0;
      for (let i = 0; i < tokens.length; i += 1) {
        const isCoartPair = tokens[i].coartWithNext && i + 1 < tokens.length;
        const pairLen = isCoartPair ? 2 : 1;

        while (r < ranges.length && i >= ranges[r][1]) r += 1;
        if (r < ranges.length && (i === ranges[r][0] || (isCoartPair && i + 1 === ranges[r][0]))) {
          out += '<mark class="hl">';
        }

        if (isCoartPair) {
          out += renderCoartPair(tokens[i], tokens[i + 1]);
          if (r < ranges.length && (i + 1 === ranges[r][1] || i + 2 === ranges[r][1])) {
            out += '</mark>';
          }
          i += 1;
          continue;
        }
        out += renderHeadToken(tokens[i]);

        if (r < ranges.length && i + pairLen === ranges[r][1]) out += '</mark>';
      }
      return out;
    }

    function renderHeads(heads, rawQuery) {
      return toFullWidth((heads || []).map(h => renderHeadWord(h, rawQuery)).join('、'));
    }

    function renderHeadPairs(heads, pinyins, rawQuery) {
      const hs = Array.isArray(heads) ? heads : [];
      const ps = Array.isArray(pinyins) ? pinyins : [];
      if (!hs.length) return '';

      // 旧数据里可能是“多个词头共用一个读音”，保留原显示。
      if (ps.length <= 1 || ps.length !== hs.length) {
        const headHtml = renderHeads(hs, rawQuery);
        const normalizedPinyin = ps.map(formatPinyin).filter(Boolean);
        const pinyinHtml = ps.length
          ? `<span class="heads-pinyin">${highlightText(normalizedPinyin.join('; '), rawQuery)}</span>`
          : '';
        return `<span>${headHtml}</span>${pinyinHtml}`;
      }

      return hs.map((h, i) => {
        const headHtml = renderHeadWord(h, rawQuery);
        const pyHtml = `<span class="heads-pinyin">${highlightText(formatPinyin(ps[i] || ''), rawQuery)}</span>`;
        return `<span class="head-pair"><span>${headHtml}</span>${pyHtml}</span>`;
      }).join('');
    }

    function renderChunk(items, append = false) {
      if (!append) {
        listEl.innerHTML = '';
      }
      const fragments = items.map(item => {
        const heads = renderHeadPairs(item.heads, item.pinyin, currentQuery);
        const hasExp = !!(item.explanation && item.explanation.trim());
        const headsClass = hasExp ? 'heads is-toggleable' : 'heads';
        const headsAttrs = hasExp
          ? ' role="button" tabindex="0" aria-expanded="true"'
          : '';
        const dialect = renderDynamicChip(item.dialect);
        const exp = hasExp
          ? `<div class="exp">${renderExplanation(item.explanation, currentQuery)}</div>`
          : '';
        const watermark = item.book ? `<div class="watermark">${escapeHtml(item.book)}</div>` : '';
        return `
          <article class="item">
            <div class="${headsClass}"${headsAttrs}><span class="heads-main">${heads}</span>${dialect}</div>
            ${exp}
            ${watermark}
          </article>
        `;
      });
      if (append) {
        listEl.insertAdjacentHTML('beforeend', fragments.join(''));
      } else {
        listEl.innerHTML = fragments.join('');
      }
    }

    function renderExplanation(explanation, rawQuery) {
      const src = toFullWidth(String(explanation || ''));
      if (!src) return '';
      const query = toFullWidth(String(rawQuery || ''));
      const regex = /〔([^〕]+)〕/g;
      let last = 0;
      let out = '';
      let m;
      while ((m = regex.exec(src)) !== null) {
        if (m.index > last) {
          out += highlightText(src.slice(last, m.index), query);
        }

        // 标签和普通文字之间补空格；连续标签之间不补。
        const prevChar = m.index > 0 ? src[m.index - 1] : '';
        if (prevChar && !/\s/.test(prevChar) && prevChar !== '〕') {
          out += '<br>';
        }

        out += renderDynamicChip(m[1]);

        const nextIndex = m.index + m[0].length;
        const nextChar = nextIndex < src.length ? src[nextIndex] : '';
        if (nextChar && !/\s/.test(nextChar) && nextChar !== '〔') {
          out += ' ';
        }

        last = m.index + m[0].length;
      }
      if (last < src.length) {
        out += highlightText(src.slice(last), query);
      }
      out = out.replace(/\{([^{}]*?)\}/g, '<sub>$1</sub>');
      return out;
    }

    function renderReferences() {
      const refListEl = document.getElementById('refList');
      const refTotalCountEl = document.getElementById('refTotalCount');
      refTotalCountEl.textContent = `（${DATA.length}条词）`;
      const refEntries = Object.entries(REFS || {});
      if (!refEntries.length) {
        refListEl.innerHTML = '<li>暂无参考资料</li>';
        return;
      }

      const rows = refEntries.map(([dialect, meta]) => {
        const book = escapeHtml(String((meta && meta.book) || ''));
        const author = String((meta && meta.author) || '');
        const count = Number((meta && meta.count) || 0);
        const authorHtml = author
          ? `<span class="ref-author">（${renderExplanation(author, '').replaceAll('<br>', ' ')}）</span>`
          : '';
        const countHtml = `<span class="ref-count">${count}条词</span>`;
        return `<li>${renderDynamicChip(dialect)}<span class="ref-sep"> </span>${countHtml}<span class="ref-book">${book}</span>${authorHtml}</li>`;
      });
      refListEl.innerHTML = rows.join('');
    }

    function updateStats() {
      if (!currentMatches.length) {
        statsEl.textContent = '什么都没找到';
        return;
      }
      statsEl.textContent = `找到 ${currentMatches.length} 条`;
    }

    function teardownObserver() {
      if (io) {
        io.disconnect();
        io = null;
      }
    }

    function setupObserver() {
      teardownObserver();
      if (renderedCount >= currentMatches.length) return;
      const sentinel = document.createElement('div');
      sentinel.id = 'lazySentinel';
      sentinel.className = 'empty';
      sentinel.textContent = '向下滚动以加载更多...';
      listEl.appendChild(sentinel);

      io = new IntersectionObserver((entries) => {
        if (!entries[0] || !entries[0].isIntersecting) return;
        renderNextChunk();
      }, { rootMargin: '200px 0px' });
      io.observe(sentinel);
    }

    function renderNextChunk(reset = false) {
      if (reset) {
        renderedCount = 0;
      }
      const sentinel = document.getElementById('lazySentinel');
      if (sentinel) sentinel.remove();

      if (!currentMatches.length) {
        teardownObserver();
        listEl.innerHTML = '<div class="empty">未找到匹配词条</div>';
        updateStats();
        return;
      }

      const next = currentMatches.slice(renderedCount, renderedCount + CHUNK_SIZE);
      if (!next.length) {
        teardownObserver();
        updateStats();
        return;
      }

      renderChunk(next, renderedCount > 0);
      renderedCount += next.length;
      updateStats();
      setupObserver();
    }

    function debounce(fn, delay) {
      let timer = null;
      return function (...args) {
        clearTimeout(timer);
        timer = setTimeout(() => fn.apply(this, args), delay);
      };
    }

    function search() {
      const qRaw = qEl.value;
      const q = normQuery(qRaw);
      const dialect = dialectEl.value;
      const headOnly = isHeadOnlyEnabled();
      currentQuery = q;
      currentMatches = INDEXED.filter(x => match(x, q, dialect, headOnly));
      renderNextChunk(true);
    }

    function toggleEntryExplanationFromHeads(headRowEl) {
      if (!headRowEl || !headRowEl.classList.contains('is-toggleable')) return;
      const itemEl = headRowEl.closest('.item');
      if (!itemEl) return;
      const expEl = itemEl.querySelector('.exp');
      if (!expEl) return;

      const collapsed = expEl.classList.toggle('is-collapsed');
      headRowEl.classList.toggle('is-collapsed', collapsed);
      headRowEl.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
    }

    function hasActiveSelectionInElement(el) {
      if (!el || !window.getSelection) return false;
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return false;
      const range = sel.getRangeAt(0);
      const container = range.commonAncestorContainer;
      const node = container.nodeType === Node.TEXT_NODE ? container.parentNode : container;
      return !!(node && el.contains(node));
    }

    function escapeHtml(s) {
      return s
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeChip(s) {
      s = escapeHtml(s).replace(/\d+$/, '')
      s = s.replace(/[\(（](.*?)[\)）]/, '<sub>$1</sub>')
      return s;
    }

    function finishLoading() {
      qEl.disabled = false;
      qEl.placeholder = '搜索词、音、义';
    }

    function getSoleSelectedDialectChip(selection) {
      if (!selection || selection.rangeCount === 0 || selection.isCollapsed) return null;
      const range = selection.getRangeAt(0);
      const selectedText = selection.toString().trim();
      if (!selectedText) return null;

      const chips = Array.from(document.querySelectorAll('.chip.chip-dynamic'));
      const intersected = chips.filter(chip => {
        try {
          return range.intersectsNode(chip);
        } catch (_) {
          return false;
        }
      });
      if (intersected.length !== 1) return null;

      const chip = intersected[0];
      const chipText = (chip.textContent || '').trim();
      if (!chipText) return null;
      if (selectedText !== chipText) return null;
      return chip;
    }

    const searchDebounced = debounce(search, DEBOUNCE_MS);
    qEl.addEventListener('input', searchDebounced);
    dialectEl.addEventListener('change', search);
    document.addEventListener('copy', (event) => {
      const selection = window.getSelection();
      const chip = getSoleSelectedDialectChip(selection);
      if (!chip || !event.clipboardData) return;
      const label = (chip.textContent || '').trim();
      event.preventDefault();
      event.clipboardData.setData('text/plain', `〔${label}〕`);
    });
    listEl.addEventListener('click', (event) => {
      const headRowEl = event.target.closest('.heads');
      if (hasActiveSelectionInElement(headRowEl)) return;
      toggleEntryExplanationFromHeads(headRowEl);
    });
    listEl.addEventListener('keydown', (event) => {
      if (event.key !== 'Enter' && event.key !== ' ') return;
      const headRowEl = event.target.closest('.heads');
      if (!headRowEl || !headRowEl.classList.contains('is-toggleable')) return;
      event.preventDefault();
      toggleEntryExplanationFromHeads(headRowEl);
    });
    headOnlyBtnEl.addEventListener('click', () => {
      setHeadOnlyEnabled(!isHeadOnlyEnabled());
      search();
    });

    // Initial render loads all entries
    renderReferences();
    statsEl.textContent = '正在加载...';
    listEl.innerHTML = '<div class="empty">正在加载词条...</div>';
    setHeadOnlyEnabled(false);
    finishLoading();
    search();
  </script>
</body>
</html>
